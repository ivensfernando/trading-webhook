name: TradingView CI/CD

on:
  push:
    branches: [developer, main]
  pull_request:
    branches: [developer, main]

jobs:
  build-test-lint:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: |
          npm install eslint --no-save
          npx eslint .

      - name: Run tests
        run: npm test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t webhook-app:latest .

  deploy:
    name: Deploy to Local K8s
    if: github.ref == 'refs/heads/developer'
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Makefile to deploy
        run: |
          make build
          make deploy
          make ingress

