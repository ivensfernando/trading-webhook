# k8s/health.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-deployment
spec:
  template:
    spec:
      containers:
        - name: webhook
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
