# Ingress to expose Webhook App outside Minikube
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: webhook.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhook-service
                port:
                  number: 3000
